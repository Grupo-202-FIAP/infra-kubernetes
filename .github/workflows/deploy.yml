name: Deploy Infra Kubernetes (EKS + Addons)

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-cluster:
    name: Deploy EKS Cluster
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform/cluster

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-role
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -var-file=terraform.tfvars

      - name: Terraform Apply - Cluster
        run: terraform apply -auto-approve -var-file=terraform.tfvars

  deploy-bootstrap:
    name: Deploy Bootstrap (ArgoCD, Helm, etc.)
    runs-on: ubuntu-latest
    needs: deploy-cluster

    defaults:
      run:
        working-directory: infra/terraform/bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init - Bootstrap
        run: terraform init

      - name: Terraform Validate - Bootstrap
        run: terraform validate

      - name: Terraform Apply - Bootstrap Base
        run: |
          terraform apply -auto-approve -var-file=terraform.tfvars \
            -target=helm_release.aws_lb_controller \
            -target=helm_release.metrics_server \
            -target=helm_release.ebs_csi \
            -target=aws_iam_role.aws_lb_controller \
            -target=aws_iam_role.ebs_csi

      - name: Wait for AWS Load Balancer Controller
        run: |
          aws eks update-kubeconfig \
            --name nexTime-cluster \
            --region $AWS_REGION

          kubectl wait \
            --for=condition=Available \
            deployment/aws-load-balancer-controller \
            -n kube-system \
            --timeout=300s

      - name: Terraform Apply - Bootstrap Full
        run: terraform apply -auto-approve -var-file=terraform.tfvars
