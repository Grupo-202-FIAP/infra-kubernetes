name: Destroy Infra Kubernetes (EKS)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY para confirmar a destruição do cluster'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  destroy-bootstrap:
    name: Destroy Bootstrap (ArgoCD, Helm, etc)
    runs-on: ubuntu-latest

    if: github.event.inputs.confirm == 'DESTROY'

    defaults:
      run:
        working-directory: infra/terraform/bootstrap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init - Bootstrap
        run: terraform init

      - name: Terraform Destroy - Bootstrap
        run: terraform destroy -auto-approve -var-file=terraform.tfvars

  destroy-cluster:
    name: Destroy EKS Cluster
    runs-on: ubuntu-latest
    needs: destroy-bootstrap

    if: github.event.inputs.confirm == 'DESTROY'

    defaults:
      run:
        working-directory: infra/terraform/cluster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-action-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init - Cluster
        run: terraform init

      - name: Terraform Destroy - Cluster
        run: terraform destroy -auto-approve -var-file=terraform.tfvars
